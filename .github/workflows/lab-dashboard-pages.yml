name: LAB dashboard preview artifact (no production Pages deployment)
run-name: "LAB UI Preview | #${{ github.run_number }}"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify lab engine and dashboard
        run: python -m unittest discover -s tests -p 'test_recovery_v55_*.py' -v
      - name: Generate provenance manifest
        run: python engine_manifest.py --output dashboard/engine-manifest.json
      - name: Package isolated preview
        uses: actions/upload-artifact@v4
        with:
          name: lab-dashboard-preview
          path: |
            dashboard/index.html
            dashboard/engine-manifest.json
          retention-days: 14
