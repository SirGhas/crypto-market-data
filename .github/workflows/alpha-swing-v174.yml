name: Alpha BTC Combined Flip Sensitivity v1.7.4
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run combined strict classifier and sensitivity tests
        run: python -m unittest discover -s tests -p 'test_alpha_flip_v17*.py' -v
      - name: One historical fetch for all sensitivity variants
        run: python -m engine.alpha_flip_v174
      - name: Save all results in one artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-swing-v174-btc-combined
          path: artifacts/alpha_swing_v174_btc.json
          retention-days: 14
          if-no-files-found: warn
