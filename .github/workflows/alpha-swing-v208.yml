name: Alpha BTC Cross-Run Offline Replay v2.0.8
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed v2.0.7 run containing retained snapshot artifact"
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run consolidated alpha tests
        run: python -m unittest discover -s tests -p 'test_alpha_*v*.py' -v
      - name: Download retained artifact from a separate completed run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          test "$SOURCE_RUN_ID" != "${{ github.run_id }}" || exit 1
          mkdir -p cross_run_input
          gh run download "$SOURCE_RUN_ID" --repo "${{ github.repository }}" --name alpha-v207-btc-offline-replay --dir cross_run_input
      - name: Verify offline replay and source report
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from engine.alpha_cross_run_replay_v208 import verify
          root=Path('cross_run_input')
          report=root/'alpha_swing_v206_btc_snapshot_report.json'
          snapshot=root/'alpha_swing_v206_btc_4h_snapshot.json'
          source=json.loads(report.read_text())
          source_replay=root/'alpha_swing_v207_btc_offline_replay.json'
          result=verify(snapshot,report,source['snapshot_file_sha256'],
                        os.environ['SOURCE_RUN_ID'],os.environ['CURRENT_RUN_ID'],source_replay)
          out=Path('artifacts/alpha_swing_v208_cross_run_replay.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(result,indent=2)+'\n')
          print('ALPHA_V208',json.dumps(result))
          PY
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-v208-cross-run-verification
          path: artifacts/alpha_swing_v208_cross_run_replay.json
          if-no-files-found: warn
          retention-days: 14
