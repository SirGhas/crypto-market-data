name: Alpha BTC Cross-TF and Window Stability v1.7.0
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Window stability unit tests
        run: python -m unittest discover -s tests -p 'test_alpha_stability_v170.py' -v
      - name: BTC 4H stability and daily overlap research
        run: python -m engine.alpha_swing_run_v170
      - name: Upload research audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-swing-v170-btc
          path: artifacts/alpha_swing_v170_btc.json
          retention-days: 14
          if-no-files-found: warn
