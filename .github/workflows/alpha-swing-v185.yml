name: Alpha BTC Chronological Subperiods v1.8.5
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/alpha_subperiod_audit_v185.py'
      - 'tests/test_alpha_subperiod_audit_v185.py'
      - '.github/workflows/alpha-swing-v185.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consolidated alpha tests
        run: python -m unittest discover -s tests -p 'test_alpha_*v1*.py' -v
      - name: BTC chronological subperiod research
        run: python -m engine.alpha_subperiod_audit_v185
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-v185-btc-chronological-subperiods
          path: artifacts/alpha_swing_v185_btc_subperiods.json
          if-no-files-found: error
          retention-days: 14
