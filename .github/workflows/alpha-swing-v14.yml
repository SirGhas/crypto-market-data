name: Alpha Structural Risk Research v1.4
on:
  workflow_dispatch:
# Schedule remains disabled until research validation.
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate structural risk overlay
        run: python -m unittest discover -s tests -p 'test_alpha_risk_v14.py' -v
      - name: Get previous v1.3 baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m engine.alpha_prev_swing_v13
      - name: Get v1.2 fallback baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m engine.alpha_prev_swing_v12
      - name: Collect and classify plus structural risk research
        run: python -m engine.alpha_swing_run_v14
      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-swing-v14
          path: artifacts/alpha_swing_v14.json
          retention-days: 14
          if-no-files-found: warn
