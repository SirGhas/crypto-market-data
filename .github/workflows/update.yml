name: Update crypto data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: crypto-data-update
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect Kraken and dominance
        run: python collector.py
      - name: Screen legacy signals
        run: python signal_engine.py
      - name: Collect multi-source spot candles
        run: python multisource_collector.py
      - name: Create multi-source report
        run: python report_v51.py
      - name: Commit data snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market.json data/dominance_history.json data/signals.json data/signal_state.json data/multisource_market.json data/report_v51.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update market and v5.1 report'
            git push
          fi
