name: Update crypto data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: crypto-data-update
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and commit with safe conflict recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # On push conflict, regenerate against the latest remote state.
          for attempt in 1 2 3; do
            echo "Collection attempt ${attempt}/3"
            python collector.py
            python signal_engine.py
            python multisource_collector.py
            python freshness_report_v54.py data/multisource_market.json data/freshness_report_v54.json
            python data_integrity_gate_v54.py data/multisource_market.json
            python report_v51.py
            python event_engine_v52.py
            python dual_screen_v53.py

            git add -- data/market.json data/dominance_history.json data/signals.json data/signal_state.json data/multisource_market.json data/freshness_report_v54.json data/report_v51.json data/events_v52.json data/event_state_v52.json data/dual_screen_v53.json
            if git diff --cached --quiet; then
              echo 'No changes to commit.'
              exit 0
            fi
            git commit -m "Update crypto research snapshots (v5.3; freshness v5.4.1)"
            if git push origin HEAD:main; then
              echo 'Snapshots committed successfully.'
              exit 0
            fi

            echo 'Push rejected; another commit landed first.'
            if [ "$attempt" -eq 3 ]; then
              echo 'Three push attempts failed; refusing force-push.' >&2
              exit 1
            fi
            git fetch origin main
            git reset --hard origin/main
            sleep "$attempt"
          done
