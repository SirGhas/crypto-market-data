name: Phemex SLVON Read-only Feed Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest tests.test_phemex_slvon_probe tests.test_tokenized_metals_registry -v
      - name: Read-only public Phemex probe
        run: python phemex_slvon_probe.py
      - name: Upload evidence even if probe fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phemex-slvon-feed-evidence
          path: artifacts/slvon_phemex_probe.json
          if-no-files-found: warn
          retention-days: 14
