name: Phemex SLVON Read-only Feed Probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'phemex_slvon_probe.py'
      - 'tokenized_metals_registry.py'
      - 'tests/test_phemex_slvon_probe.py'
      - 'tests/test_tokenized_metals_registry.py'
      - 'paper_signal_gate.py'
      - 'tests/test_paper_signal_gate.py'
      - 'paper_signal_journal.py'
      - 'tests/test_paper_signal_journal.py'
      - 'paper_performance.py'
      - 'tests/test_paper_performance.py'
      - 'historical_replay_audit.py'
      - 'tests/test_historical_replay_audit.py'
      - '.github/workflows/phemex-slvon-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest tests.test_phemex_slvon_probe tests.test_tokenized_metals_registry tests.test_paper_signal_gate tests.test_paper_signal_journal tests.test_paper_performance tests.test_historical_replay_audit -v
      - name: Read-only public Phemex probe
        run: python phemex_slvon_probe.py
      - name: Upload evidence even if probe fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phemex-slvon-feed-evidence
          path: artifacts/slvon_phemex_probe.json
          if-no-files-found: warn
          retention-days: 14
