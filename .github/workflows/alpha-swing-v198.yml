name: Alpha BTC ATR Threshold Sensitivity v1.9.8
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/alpha_atr_sensitivity_v198.py'
      - 'tests/test_alpha_atr_sensitivity_v198.py'
      - '.github/workflows/alpha-swing-v198.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consolidated alpha tests
        run: python -m unittest discover -s tests -p 'test_alpha_*v1*.py' -v
      - name: BTC ATR threshold sensitivity audit
        run: python -m engine.alpha_atr_sensitivity_v198
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-v198-btc-atr-threshold-sensitivity
          path: artifacts/alpha_swing_v198_btc_atr_sensitivity.json
          if-no-files-found: error
          retention-days: 14
