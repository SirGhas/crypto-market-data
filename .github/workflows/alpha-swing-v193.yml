name: Alpha BTC Exclusive Window Outcomes v1.9.3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/alpha_window_outcomes_v193.py'
      - 'tests/test_alpha_window_outcomes_v193.py'
      - '.github/workflows/alpha-swing-v193.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consolidated alpha tests
        run: python -m unittest discover -s tests -p 'test_alpha_*v1*.py' -v
      - name: BTC exclusive window outcomes
        run: python -m engine.alpha_window_outcomes_v193
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-v193-btc-exclusive-window-outcomes
          path: artifacts/alpha_swing_v193_btc_exclusive_window_outcomes.json
          if-no-files-found: error
          retention-days: 14
