name: Alpha BTC Period Outcome Rates v2.0.2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/alpha_period_outcomes_v202.py'
      - 'tests/test_alpha_period_outcomes_v202.py'
      - '.github/workflows/alpha-swing-v202.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consolidated alpha tests
        run: python -m unittest discover -s tests -p 'test_alpha_*v*.py' -v
      - name: BTC period outcome rates audit
        run: python -m engine.alpha_period_outcomes_v202
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-v202-btc-period-outcome-rates
          path: artifacts/alpha_swing_v202_btc_period_outcome_rates.json
          if-no-files-found: error
          retention-days: 14
