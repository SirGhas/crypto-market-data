name: Alpha BTC Exact Level Gap Audit v2.0.4
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/alpha_level_gaps_v204.py'
      - 'tests/test_alpha_level_gaps_v204.py'
      - '.github/workflows/alpha-swing-v204.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consolidated alpha tests
        run: python -m unittest discover -s tests -p 'test_alpha_*v*.py' -v
      - name: BTC exact structural level gap audit
        run: python -m engine.alpha_level_gaps_v204
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-v204-btc-level-gaps
          path: artifacts/alpha_swing_v204_btc_exact_level_gaps.json
          if-no-files-found: error
          retention-days: 14
