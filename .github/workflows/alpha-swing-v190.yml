name: Alpha BTC History Quality v1.9.0
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/alpha_history_quality_v190.py'
      - 'tests/test_alpha_history_quality_v190.py'
      - '.github/workflows/alpha-swing-v190.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consolidated alpha tests
        run: python -m unittest discover -s tests -p 'test_alpha_*v1*.py' -v
      - name: BTC history integrity audit
        run: python -m engine.alpha_history_quality_v190
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-v190-btc-history-quality
          path: artifacts/alpha_swing_v190_btc_history_quality.json
          if-no-files-found: error
          retention-days: 14
