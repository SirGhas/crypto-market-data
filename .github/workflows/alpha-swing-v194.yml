name: Alpha BTC Mixed Outcome Side Audit v1.9.4
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/alpha_mixed_sides_v194.py'
      - 'tests/test_alpha_mixed_sides_v194.py'
      - '.github/workflows/alpha-swing-v194.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consolidated alpha tests
        run: python -m unittest discover -s tests -p 'test_alpha_*v1*.py' -v
      - name: BTC mixed-outcome side audit
        run: python -m engine.alpha_mixed_sides_v194
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-v194-btc-mixed-outcome-sides
          path: artifacts/alpha_swing_v194_btc_mixed_outcome_sides.json
          if-no-files-found: error
          retention-days: 14
