name: Alpha Market Buy Validation Research v1.6.4
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify market buy risk logic
        run: python -m unittest discover -s tests -p 'test_alpha_market_buy_v164.py' -v
      - name: Get previous v1.3 baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m engine.alpha_prev_swing_v13
      - name: Get previous v1.2 baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m engine.alpha_prev_swing_v12
      - name: Collect 11 assets and assess hypothetical market entry
        run: python -m engine.alpha_swing_run_v164
      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-swing-v164
          path: artifacts/alpha_swing_v164.json
          retention-days: 14
          if-no-files-found: warn
