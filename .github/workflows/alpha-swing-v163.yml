name: Alpha Observed Spot Prices v1.6.3
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify timestamped spot ticker logic
        run: python -m unittest discover -s tests -p 'test_alpha_swing_v163.py' -v
      - name: Verify dependency chain
        run: python -m engine.alpha_dependency_preflight
      - name: Get previous v1.3 baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m engine.alpha_prev_swing_v13
      - name: Get previous v1.2 baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m engine.alpha_prev_swing_v12
      - name: Collect and timestamp observed spot prices
        run: python -m engine.alpha_swing_run_v163
      - name: Upload observed spot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-swing-v163
          path: artifacts/alpha_swing_v163.json
          retention-days: 14
          if-no-files-found: warn
