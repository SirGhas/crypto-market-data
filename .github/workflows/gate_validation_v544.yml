name: Validate Gate BTC pairs v5.4.4
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Gate Spot BTC crosses (read only)
        run: python gate_validation_v544.py
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-validation-v544
          path: data/gate_validation_v544.json
          if-no-files-found: error
          retention-days: 14
