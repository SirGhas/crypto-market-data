name: Alpha Multi-Timeframe Level Quality Research v1.6
on:
  workflow_dispatch:
# Scheduling intentionally disabled until cross-run freshness is proven.
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test v1.6 level-quality logic
        run: python -m unittest discover -s tests -p 'test_alpha_levels_v16.py' -v
      - name: Get previous v1.3 baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m engine.alpha_prev_swing_v13
      - name: Get v1.2 fallback baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m engine.alpha_prev_swing_v12
      - name: Collect research data and multi-timeframe zones
        run: python -m engine.alpha_swing_run_v16
      - name: Upload v1.6 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-swing-v16
          path: artifacts/alpha_swing_v16.json
          retention-days: 14
          if-no-files-found: warn
