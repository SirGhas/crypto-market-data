name: Alpha BTC Chronological Research v1.8.2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/alpha_temporal_audit_v182.py'
      - 'tests/test_alpha_temporal_audit_v182.py'
      - '.github/workflows/alpha-swing-v182.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consolidated alpha research unit tests
        run: python -m unittest discover -s tests -p 'test_alpha_*v1*.py' -v
      - name: Chronological BTC 4h structural-score held-out audit
        run: python -m engine.alpha_temporal_audit_v182
      - name: Upload historical research counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-v182-btc-chronological-audit
          path: artifacts/alpha_swing_v182_btc_chronological_audit.json
          retention-days: 14
          if-no-files-found: error
