name: Alpha BTC Structural Score Audit v1.8.0
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/alpha_score_audit_v180.py'
      - 'tests/test_alpha_score_audit_v180.py'
      - '.github/workflows/alpha-swing-v180.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consolidated structural and belt research tests
        run: python -m unittest discover -s tests -p 'test_alpha_*v1*.py' -v
      - name: Historical BTC 4h importance-score stratification
        run: python -m engine.alpha_score_audit_v180
      - name: Upload descriptive research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-v180-btc-importance-audit
          path: artifacts/alpha_swing_v180_btc_score_audit.json
          retention-days: 14
          if-no-files-found: warn
