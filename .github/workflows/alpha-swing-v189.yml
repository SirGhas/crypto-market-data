name: Alpha BTC HIGH Evidence Tiers v1.8.9
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/alpha_high_evidence_tiers_v189.py'
      - 'tests/test_alpha_high_evidence_tiers_v189.py'
      - '.github/workflows/alpha-swing-v189.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consolidated alpha tests
        run: python -m unittest discover -s tests -p 'test_alpha_*v1*.py' -v
      - name: BTC HIGH evidence tiers research
        run: python -m engine.alpha_high_evidence_tiers_v189
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-v189-btc-high-evidence-tiers
          path: artifacts/alpha_swing_v189_btc_high_evidence_tiers.json
          if-no-files-found: error
          retention-days: 14
