name: Alpha v2.0.8 Cross-Run Validation Launcher
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout isolated research candidate
        uses: actions/checkout@v4
        with:
          ref: 02a90b7a6158c29000a385c596d8d3f23cfacc71
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run alpha unit tests
        run: python -m unittest discover -s tests -p 'test_alpha_*v*.py' -v
      - name: Verify source run identity and successful completion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/"${{ github.repository }}"/actions/runs/42835221306 --jq '. | select(.status == "completed" and .conclusion == "success" and .head_branch == "main" and .path == ".github/workflows/alpha-swing-v207.yml") | .id' | grep -qx '42835221306'
      - name: Download independent v2.0.7 snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cross_run_input
          gh run download 42835221306 --repo "${{ github.repository }}" --name alpha-v207-btc-offline-replay --dir cross_run_input
      - name: Replay frozen snapshot without exchange fetch
        env:
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from engine.alpha_cross_run_replay_v208 import verify
          root=Path('cross_run_input')
          source=json.loads((root/'alpha_swing_v206_btc_snapshot_report.json').read_text())
          result=verify(root/'alpha_swing_v206_btc_4h_snapshot.json',
                        root/'alpha_swing_v206_btc_snapshot_report.json',
                        source['snapshot_file_sha256'],
                        '42835221306',os.environ['CURRENT_RUN_ID'],
                        root/'alpha_swing_v207_btc_offline_replay.json')
          out=Path('artifacts/alpha_swing_v208_cross_run_replay.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(result,indent=2)+'\n')
          print('ALPHA_V208',json.dumps(result))
          PY
      - name: Publish run pointer on dedicated validation branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          WORKFLOW_PATH: .github/workflows/alpha-v208-validation-launcher.yml
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('/tmp/alpha-v208-latest-run.json')
          p.write_text(json.dumps({
              'run_id': int(os.environ['RUN_ID']),
              'run_attempt': int(os.environ['RUN_ATTEMPT']),
              'workflow_path': os.environ['WORKFLOW_PATH'],
              'result_of_prior_steps': os.environ['JOB_STATUS'],
              'source_run_id': 42835221306,
              'candidate_commit': '02a90b7a6158c29000a385c596d8d3f23cfacc71',
              'run_url': 'https://github.com/'+os.environ['REPO']+'/actions/runs/'+os.environ['RUN_ID'],
              'note': 'job status before artifact upload and pointer commit; verify final run via Actions API'
          },indent=2)+'\\n')
          PY
          git fetch origin refs/heads/research/alpha-v208-run-index:refs/remotes/origin/research/alpha-v208-run-index || true
          if git show-ref --verify --quiet refs/remotes/origin/research/alpha-v208-run-index; then
            git checkout -B research/alpha-v208-run-index refs/remotes/origin/research/alpha-v208-run-index
          else
            git checkout --orphan research/alpha-v208-run-index
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p artifacts
          cp /tmp/alpha-v208-latest-run.json artifacts/alpha_v208_latest_run.json
          git add artifacts/alpha_v208_latest_run.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Record alpha v2.0.8 validation run ${RUN_ID}" || true
          git push origin HEAD:refs/heads/research/alpha-v208-run-index
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-v208-cross-run-verification
          path: artifacts/alpha_swing_v208_cross_run_replay.json
          if-no-files-found: warn
          retention-days: 14
