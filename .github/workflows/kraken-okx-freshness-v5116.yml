name: Kraken OKX Freshness v5.11.6
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect NEW live snapshot using unchanged v5.11.5 script
        run: python tests/kraken_okx_cross_probe_v5115.py
      - name: Compare with REAL v5.11.5 reference run
        run: |
          python tests/compare_cross_snapshots_v5116.py \
            --baseline tests/fixtures/kraken_okx_baseline_v5115.json \
            --current artifacts/kraken_okx_cross_probe_v5115.json \
            --out artifacts/kraken_okx_freshness_comparison_v5116.json
      - name: Upload raw snapshot + audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kraken-okx-freshness-v5116
          path: |
            artifacts/kraken_okx_cross_probe_v5115.json
            artifacts/kraken_okx_freshness_comparison_v5116.json
          if-no-files-found: warn
          retention-days: 14
