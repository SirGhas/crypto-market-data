name: Alpha RSI and Volume v0.6
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline tests
        run: |
          python -m unittest discover -s tests -p 'test_alpha_core.py' -v
          python -m unittest discover -s tests -p 'test_alpha_sma_v04.py' -v
          python -m unittest discover -s tests -p 'test_alpha_eventstudy_v05.py' -v
          python -m unittest discover -s tests -p 'test_alpha_momentum_v06.py' -v
      - name: Research collection and indicators
        run: python -m engine.alpha_momentum_run_v06
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-momentum-v06
          path: artifacts/alpha_momentum_v06.json
          if-no-files-found: warn
          retention-days: 14
