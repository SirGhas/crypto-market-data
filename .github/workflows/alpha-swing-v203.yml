name: Alpha BTC Exact Level Recurrence v2.0.3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/alpha_level_recurrence_v203.py'
      - 'tests/test_alpha_level_recurrence_v203.py'
      - '.github/workflows/alpha-swing-v203.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consolidated alpha tests
        run: python -m unittest discover -s tests -p 'test_alpha_*v*.py' -v
      - name: BTC exact structural level recurrence audit
        run: python -m engine.alpha_level_recurrence_v203
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-v203-btc-exact-level-recurrence
          path: artifacts/alpha_swing_v203_btc_exact_level_recurrence.json
          if-no-files-found: error
          retention-days: 14
