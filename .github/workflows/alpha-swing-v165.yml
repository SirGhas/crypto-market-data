name: Alpha Market Buy Depth Research v1.6.5
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test order-book sweep and no-trade gates
        run: python -m unittest discover -s tests -p 'test_alpha_depth_v165.py' -v
      - name: Previous v1.3 baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m engine.alpha_prev_swing_v13
      - name: Previous v1.2 baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m engine.alpha_prev_swing_v12
      - name: Collect fresh depth and calculate research VWAP
        run: python -m engine.alpha_swing_run_v165
      - name: Upload report even when partial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-swing-v165
          path: artifacts/alpha_swing_v165.json
          retention-days: 14
          if-no-files-found: warn
