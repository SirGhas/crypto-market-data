name: Alpha BTC Decision Window Clusters v1.9.2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/alpha_decision_clusters_v192.py'
      - 'tests/test_alpha_decision_clusters_v192.py'
      - '.github/workflows/alpha-swing-v192.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consolidated alpha tests
        run: python -m unittest discover -s tests -p 'test_alpha_*v1*.py' -v
      - name: BTC decision-window clusters
        run: python -m engine.alpha_decision_clusters_v192
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-v192-btc-decision-clusters
          path: artifacts/alpha_swing_v192_btc_decision_clusters.json
          if-no-files-found: error
          retention-days: 14
