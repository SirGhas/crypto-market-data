name: Alpha BTC ATR Level Proximity v1.9.7
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/alpha_atr_proximity_v197.py'
      - 'tests/test_alpha_atr_proximity_v197.py'
      - '.github/workflows/alpha-swing-v197.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consolidated alpha tests
        run: python -m unittest discover -s tests -p 'test_alpha_*v1*.py' -v
      - name: BTC ATR level proximity audit
        run: python -m engine.alpha_atr_proximity_v197
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-v197-btc-atr-level-proximity
          path: artifacts/alpha_swing_v197_btc_atr_level_proximity.json
          if-no-files-found: error
          retention-days: 14
