name: Alpha BTC ATR Subperiod Distribution v1.9.9
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/alpha_atr_subperiods_v199.py'
      - 'tests/test_alpha_atr_subperiods_v199.py'
      - '.github/workflows/alpha-swing-v199.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consolidated alpha tests
        run: python -m unittest discover -s tests -p 'test_alpha_*v1*.py' -v
      - name: BTC ATR subperiod distribution audit
        run: python -m engine.alpha_atr_subperiods_v199
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-v199-btc-atr-subperiods
          path: artifacts/alpha_swing_v199_btc_mixed_atr_subperiods.json
          if-no-files-found: error
          retention-days: 14
